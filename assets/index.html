uestion": "Contraception pill memo", "answer": "Progesterone oestrogen prevents LH surge no ovulation thick cervical mucus Condom barrier 4 marks", "grade": "Grade 12", "lang": "EN", "year": "2024", "paper": "P2 Q3", "type": "memo"}, {"subject": "Life Sciences", "topic": "DBE Exemplar", "question": "Kidney dialysis memo", "answer": "Dialysis diffusion urea removed protein stays Transplant rejection immunosuppressants", "grade": "Grade 12", "lang": "EN", "year": "2023", "paper": "Exemplar", "type": "memo"}, {"subject": "Life Sciences", "topic": "NSC 2024 P1", "question": "NSC 2024 Life Sci P1 memo", "answer": "DNA, meiosis, genetics, evolution. 150 marks. Genetics cross 25% ratio.", "grade": "Grade 12", "lang": "EN", "year": "2024", "paper": "P1", "type": "past paper"}, {"subject": "Life Sciences", "topic": "NSC 2025 P1", "question": "NSC 2025 Life Sci P1 memo", "answer": "DNA, meiosis, genetics, evolution. Focus: genetics cross, pedigree, DNA replication.", "grade": "Grade 12", "lang": "EN", "year": "2025", "paper": "P1", "type": "past paper"}, {"subject": "Life Sciences", "topic": "Bridge Gr9", "question": "Grade 9 bridge - Cells memo", "answer": "Cell = smallest life. Plant cell has wall + chloroplast. Animal does not. Learn this, Gr10 is easy.", "grade": "Grade 9", "lang": "EN", "year": "", "paper": "Bridge", "type": "define"}, {"subject": "Mathematics", "topic": "Algebra", "question": "Solve 2x+3=11 memo", "answer": "2x=8 x=4 check 2*4+3=11 subtract 3 divide 2", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Functions", "question": "Parabola turning point memo", "answer": "y = ax2+bx+c. Axis x = -b/2a. Turning point substitute. If a>0 minimum, a<0 maximum.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Exponents", "question": "Exponents laws memo Gr10", "answer": "a^m x a^n = a^(m+n), a^m / a^n = a^(m-n), (a^m)^n = a^(mn), a^0=1, a^-n=1/a^n. Example: 2^3 x 2^2 = 2^5=32.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Mathematics", "topic": "Factorisation", "question": "Factorise x2+5x+6 memo", "answer": "Find 2 numbers multiply 6 add 5: 2 and 3. (x+2)(x+3). Check: x2+3x+2x+6.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Linear Equations", "question": "Solve 3x-7=11 memo", "answer": "3x=18, x=6. Check 3*6-7=11. Move terms: -7 becomes +7 other side.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Inequalities", "question": "Solve 2x+1<7 memo", "answer": "2x<6, x<3. Number line open circle at 3, arrow left. If multiply by negative, flip sign.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Functions Gr10", "question": "Function notation f(x)=2x+3, f(2)=?", "answer": "f(2)=2*2+3=7. Input x, output y. Domain = x values, Range = y values.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Geometry Gr10", "question": "Triangle angles sum memo", "answer": "Interior angles sum 180. Example: 90+60+x=180, x=30. Exterior = sum of 2 opposite interior.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Mathematics", "topic": "Probability Gr10", "question": "Probability coin + dice memo", "answer": "P = favourable/total. Coin head 1/2. Dice 6 = 1/6. Both: 1/2 x 1/6 = 1/12. And = multiply, Or = add.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Quadratic", "question": "Solve x^2-5x+6=0", "answer": "(x-2)(x-3)=0 x=2 or 3 Formula (-b +/- sqrt(b2-4ac))/2a Discriminant>0 2 real", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Trig", "question": "Define sin cos tan", "answer": "SOHCAHTOA sin=opp/hyp cos=adj/hyp tan=opp/adj Graph wave", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Mathematics", "topic": "Stats", "question": "Mean median mode", "answer": "Mean sum/n Median middle Mode frequent Range max-min", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Mathematics", "topic": "Trigonometry", "question": "Trig identities memo", "answer": "sin2+cos2=1. tan = sin/cos. Special angles 30,45,60. Solve in interval [0;360].", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Mathematics", "topic": "Sequences Gr11", "question": "Arithmetic sequence Tn memo", "answer": "Tn = a+(n-1)d. Example: 3,7,11... a=3 d=4 T10=3+9*4=39. Sum Sn=n/2[2a+(n-1)d].", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Sequences Gr11", "question": "Geometric sequence memo", "answer": "Tn = ar^(n-1). Example: 2,6,18... r=3 T5=2*3^4=162. Sum Sn=a(r^n-1)/(r-1).", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Finance Gr11", "question": "Future value annuity memo", "answer": "F = x[((1+i)^n -1)/i]. Example: save R100/month 12% p.a. monthly i=0.01 n=12 F=100[(1.01^12-1)/0.01]=R1268.25.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Trig Gr11", "question": "Trig equations sin x = 0.5 memo", "answer": "x=30 or 150 in [0;360]. Reference angle 30. Sin positive Q1+Q2. Draw CAST diagram.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Analytical Gr11", "question": "Distance + midpoint memo", "answer": "Distance = sqrt((x2-x1)^2+(y2-y1)^2). Midpoint = ((x1+x2)/2,(y1+y2)/2). Gradient m=(y2-y1)/(x2-x1).", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Stats Gr11", "question": "Standard deviation memo", "answer": "Mean, variance = sum(x-mean)^2/n, SD = sqrt(variance). Outlier affects mean, not median.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "NSC 2023 P1", "question": "Inequality memo", "answer": "x2-4>0 x<-2 or x>2 number line open 3 marks", "grade": "Grade 12", "lang": "EN", "year": "2023", "paper": "P1", "type": "memo"}, {"subject": "Mathematics", "topic": "Calculus", "question": "Derivative first principles memo", "answer": "f'(x) = lim h->0 [f(x+h)-f(x)]/h. Power rule: d/dx x^n = n x^(n-1). Max/min f'=0.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "NSC 2023 P1", "question": "NSC 2023 Maths P1 memo", "answer": "Algebra, functions, calculus, finance. 150 marks. Show all steps, no calculator skipping.", "grade": "Grade 12", "lang": "EN", "year": "2023", "paper": "P1", "type": "past paper"}, {"subject": "Mathematics", "topic": "NSC 2023 P2", "question": "NSC 2023 Maths P2 memo", "answer": "Trig, stats, geometry, analytical. Prove circle theorems, use diagram.", "grade": "Grade 12", "lang": "EN", "year": "2023", "paper": "P2", "type": "past paper"}, {"subject": "Mathematics", "topic": "NSC 2022 P1", "question": "NSC 2022 Maths P1 memo", "answer": "Quadratic, sequences, finance. Pattern: Tn = a+(n-1)d arithmetic, Tn = ar^(n-1) geometric.", "grade": "Grade 12", "lang": "EN", "year": "2022", "paper": "P1", "type": "past paper"}, {"subject": "Mathematics", "topic": "Functions Gr12", "question": "Inverse function memo", "answer": "Swap x and y, solve for y. f(x)=2x+3 -> y=2x+3 -> x=2y+3 -> y=(x-3)/2. f^-1(x)=(x-3)/2.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Finance Gr12", "question": "Present value memo", "answer": "P = x[1-(1+i)^-n]/i. Loan R100k, i=1% monthly, n=60, payment = P*i/[1-(1+i)^-n].", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Probability Gr12", "question": "Probability tree + counting memo", "answer": "n! = n factorial. Permutations nPr, Combinations nCr. Tree: multiply along branches, add across.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "Geometry Gr12", "question": "Circle theorem - angle at centre memo", "answer": "Angle at centre = 2 x angle at circumference. Same arc. Example: centre 80, circumference 40.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Mathematics", "topic": "Calculus Gr12", "question": "Optimisation memo", "answer": "Find max area: A = x*y, express y in x, A(x), A'=0, check second derivative. Example fence 100m: max area 625m2.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Mathematics", "topic": "NSC 2024 P1", "question": "NSC 2024 Maths P1 memo", "answer": "Algebra, calculus, finance. Show formula + substitution.", "grade": "Grade 12", "lang": "EN", "year": "2024", "paper": "P1", "type": "past paper"}, {"subject": "Mathematics", "topic": "NSC 2024 P2", "question": "NSC 2024 Maths P2 memo", "answer": "Trig, stats, geometry. Circle theorems, analytical.", "grade": "Grade 12", "lang": "EN", "year": "2024", "paper": "P2", "type": "past paper"}, {"subject": "Mathematics", "topic": "NSC 2025 P1", "question": "NSC 2025 Maths P1 - Expected topics memo", "answer": "Algebra, functions, calculus, finance. Same pattern as 2023/2024. Practice 2023+2024 papers = ready for 2025.", "grade": "Grade 12", "lang": "EN", "year": "2025", "paper": "P1", "type": "past paper"}, {"subject": "Mathematics", "topic": "Bridge Gr9", "question": "Grade 9 bridge - Fractions to Algebra memo", "answer": "If you missed Gr9: Fractions a/b, decimals, percentages. Algebra: 2x+3=11 -> x=4. Practice 10 mins daily, then Gr10 works.", "grade": "Grade 9", "lang": "EN", "year": "", "paper": "Bridge", "type": "method"}, {"subject": "Mathematics", "topic": "Bridge Gr9", "question": "Grade 9 bridge - Pythagoras memo", "answer": "a2+b2=c2. Example 3-4-5 triangle: 9+16=25, c=5. Use for Gr10 geometry.", "grade": "Grade 9", "lang": "EN", "year": "", "paper": "Bridge", "type": "law"}, {"subject": "Maths Literacy", "topic": "Finance", "question": "Calculate simple interest R5000 at 8% for 3 years", "answer": "I = P x r x n = 5000 x 0.08 x 3 = R1200. Total = R6200. Simple interest stays on original principal.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Maths Literacy", "topic": "Maps", "question": "Map scale 1:50000 - 4cm on map = ? real", "answer": "Real = 4 x 50000 = 200000cm = 2000m = 2km. Divide by 100 for m, 1000 for km.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Maths Literacy", "topic": "Finance", "question": "Compound interest R5000 8% 3 years memo", "answer": "A = P(1+i)^n = 5000(1.08)^3 = 5000 x 1.2597 = R6298.56. Interest = R1298.56. Compound earns on interest too.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Maths Literacy", "topic": "Data", "question": "VAT 15% on R2300 item - total?", "answer": "VAT = 2300 x 0.15 = R345. Total = R2645. VAT is added, not included.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Maths Literacy", "topic": "NSC 2023 P1", "question": "NSC 2023 Maths Lit P1 Q1 Finance memo", "answer": "Budget: Income - Expenses. Bank charges, tariff, break-even. Q1: 12 marks - tariff slabs, VAT, interest. Show all steps.", "grade": "Grade 12", "lang": "EN", "year": "2023", "paper": "P1", "type": "past paper"}, {"subject": "Maths Literacy", "topic": "NSC 2022 P2", "question": "NSC 2022 Maths Lit P2 Maps + Data memo", "answer": "Map scale, distance, probability 1/6 dice, mean/median. Probability = favourable / total.", "grade": "Grade 12", "lang": "EN", "year": "2022", "paper": "P2", "type": "past paper"}, {"subject": "Mechanical Technology", "topic": "Engines", "question": "Mechanical Tech - 4-stroke memo", "answer": "Intake, Compression, Power, Exhaust. Petrol spark plug, Diesel compression ignition. Safety: PPE, lockout.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "process"}, {"subject": "Music", "topic": "Theory", "question": "Music theory memo", "answer": "Treble + Bass clef, scales major/minor, chords I-IV-V. Rhythm: semibreve 4 beats, minim 2, crotchet 1.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Physical Sciences", "topic": "Physics - Mechanics", "question": "Newton 2nd law calculation memo", "answer": "F = ma. Example: m=2kg, a=3m/s2, F=6N. Weight = mg, g=9.8. Free body diagram. In words: F = Force, push/pull, measured in Newtons (N). m = mass, how heavy, in kg. a = acceleration, how fast speed changes, in m/s2. Example: push 2kg with 3m/s2 = 6N force. In words: Weight = how heavy gravity pulls you. m = mass in kg. g = gravity 9.8 m/s2 on Earth.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Physical Sciences", "topic": "Chemistry - Periodic Table", "question": "Periodic table trends memo", "answer": "Across: atomic radius decreases, electronegativity increases. Down: radius increases, reactivity increases for metals.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Physical Sciences", "topic": "Physics - Vectors", "question": "Vectors resultant memo Gr10", "answer": "Add head-to-tail. Pythagoras for perpendicular: R2 = x2+y2. Direction tan theta = y/x. Scalar = magnitude only, Vector = magnitude + direction.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Physical Sciences", "topic": "Physics - Motion", "question": "Equations of motion memo Gr10", "answer": "v=u+at, s=ut+1/2at2, v2=u2+2as, s=(u+v)/2*t. Free fall a=g=9.8 downwards.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "Chemistry - Bonding", "question": "Ionic vs Covalent memo Gr10", "answer": "Ionic: metal + non-metal, transfer electrons, NaCl. Covalent: non-metal + non-metal, share electrons, H2O. Metallic: sea of electrons.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Physical Sciences", "topic": "Chemistry - Acids", "question": "Acids and bases memo Gr10", "answer": "Acid pH<7, Base pH>7, Neutral 7. Acid + Base -> Salt + Water. HCl + NaOH -> NaCl + H2O.", "grade": "Grade 10", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "Newton", "question": "Newton laws memo", "answer": "1 inertia 2 F=ma 3 action reaction Ek=1/2mv2 Ep=mgh In words: F = Force, push/pull, measured in Newtons (N). m = mass, how heavy, in kg. a = acceleration, how fast speed changes, in m/s2. Example: push 2kg with 3m/s2 = 6N force. In words: Ek = Kinetic Energy, energy of moving, in Joules (J). m = mass in kg. v = velocity speed in m/s. Faster = much more energy. In words: Ep = Potential Energy, stored energy because high up, in Joules. m = mass kg. g = 9.8 gravity. h = height in metres. Higher = more stored energy.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "Waves", "question": "Frequency wavelength memo", "answer": "Frequency Hz Wavelength m v=f lambda Doppler red shift", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Physical Sciences", "topic": "Ohm", "question": "Ohm law memo", "answer": "V=IR Series I same V divide Parallel V same I divide P=VI", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "Physics - Electricity", "question": "Series vs Parallel memo", "answer": "Series: I same, V splits, R total = sum. Parallel: V same, I splits, 1/R = 1/R1+1/R2. P=VI, E=Pt.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "Chemistry - Stoichiometry", "question": "Mole calculation memo", "answer": "n = m/M. Example: 10g NaCl, M=58.5, n=0.17 mol. Avogadro 6.02x10^23. Molar volume 22.4 dm3 at STP.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "calc"}, {"subject": "Physical Sciences", "topic": "Physics - Waves Gr11", "question": "Wave equation + Doppler memo", "answer": "v = f x lambda. Doppler: source moving towards = higher frequency, away = lower. Red shift universe expanding.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "Physics - Electrostatics", "question": "Coulomb law memo Gr11", "answer": "F = kQ1Q2/r2, k=9x10^9. Like charges repel, unlike attract. Electric field E=F/q.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "NSC 2023 P1", "question": "Projectile memo", "answer": "x=vx t y=vy t -1/2 gt2 max height vy=0 symmetrical 6 marks", "grade": "Grade 12", "lang": "EN", "year": "2023", "paper": "P1", "type": "memo"}, {"subject": "Physical Sciences", "topic": "NSC 2023 P1", "question": "NSC 2023 Physical Sciences P1 Physics memo", "answer": "Mechanics, waves, electricity. Show formula, substitution, answer + unit. 150 marks.", "grade": "Grade 12", "lang": "EN", "year": "2023", "paper": "P1", "type": "past paper"}, {"subject": "Physical Sciences", "topic": "NSC 2023 P2", "question": "NSC 2023 Physical Sciences P2 Chemistry memo", "answer": "Organic, rates, equilibrium, acids/bases. Ka, pH = -log[H+]. Le Chatelier: shift to oppose change.", "grade": "Grade 12", "lang": "EN", "year": "2023", "paper": "P2", "type": "past paper"}, {"subject": "Physical Sciences", "topic": "Chemistry - Rates", "question": "Rate of reaction memo Gr12", "answer": "Rate = change concentration / time. Factors: temp, concentration, surface area, catalyst. Catalyst lowers activation energy.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "explain"}, {"subject": "Physical Sciences", "topic": "Chemistry - Equilibrium", "question": "Equilibrium memo Gr12", "answer": "Dynamic: forward = reverse rate. Le Chatelier: increase temp shifts endothermic, increase pressure shifts fewer moles, increase concentration shifts opposite.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "Chemistry - Organic", "question": "Organic homologous series memo Gr12", "answer": "Alkanes CnH2n+2, Alkenes CnH2n, Alkynes CnH2n-2, Alcohols CnH2n+2O. Functional group decides properties. Isomers same formula diff structure.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Physical Sciences", "topic": "Physics - Photoelectric", "question": "Photoelectric effect memo Gr12", "answer": "Photon E=hf, hf0 = work function. If f < f0 no electrons. Ekmax = hf - hf0. Proves light is particle.", "grade": "Grade 12", "lang": "EN", "year": "", "paper": "Textbook", "type": "law"}, {"subject": "Physical Sciences", "topic": "NSC 2024 P1", "question": "NSC 2024 Physics P1 memo", "answer": "Mechanics + electricity. F=ma, V=IR, energy. In words: F = Force, push/pull, measured in Newtons (N). m = mass, how heavy, in kg. a = acceleration, how fast speed changes, in m/s2. Example: push 2kg with 3m/s2 = 6N force.", "grade": "Grade 12", "lang": "EN", "year": "2024", "paper": "P1", "type": "past paper"}, {"subject": "Physical Sciences", "topic": "NSC 2024 P2", "question": "NSC 2024 Chemistry P2 memo", "answer": "Organic, equilibrium, acids. pH, Ka.", "grade": "Grade 12", "lang": "EN", "year": "2024", "paper": "P2", "type": "past paper"}, {"subject": "Physical Sciences", "topic": "NSC 2025 P1", "question": "NSC 2025 Physics P1 memo", "answer": "Mechanics, waves, electricity. Same structure every year.", "grade": "Grade 12", "lang": "EN", "year": "2025", "paper": "P1", "type": "past paper"}, {"subject": "Physical Sciences", "topic": "Bridge Gr9", "question": "Grade 9 bridge - Forces memo", "answer": "Force pushes/pulls. Gravity pulls down. Friction opposes. Learn F=ma now, Gr10 physics is same. In words: F = Force, push/pull, measured in Newtons (N). m = mass, how heavy, in kg. a = acceleration, how fast speed changes, in m/s2. Example: push 2kg with 3m/s2 = 6N force.", "grade": "Grade 9", "lang": "EN", "year": "", "paper": "Bridge", "type": "law"}, {"subject": "Religion Studies", "topic": "Religions", "question": "Religion Studies memo", "answer": "African Traditional, Christianity, Islam, Hinduism, Judaism, Buddhism. Respect, tolerance, no discrimination.", "grade": "Grade 11", "lang": "EN", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Sepedi", "topic": "Tsa Sepedi", "question": "Sepedi - dikarolo t\u0161a polelo memo", "answer": "Leina, lediri, lehlathi. Nako: e fetilego, e lego, e tlago. Tlhamo: matseno, mmele, mafelelo.", "grade": "Grade 11", "lang": "NSO", "year": "", "paper": "Textbook", "type": "define"}, {"subject": "Sesotho", "topic": "Sesotho", "question": "Sesotho - dikarolo memo", "answer": "Lebitso, leetsi, lehlalosi. Nako e fetileng, e teng, e tlang. Moqoqo: selelekela, mmele, qetello.", "grade": "Grade 11", "lang": "ST", "year": "", "paper": "T <h1>📚 NINO STUDY</h1><div class="sub">For every child. No data. No WiFi. No textbook needed. — Created by SIIMAMKELE NGXONONO from KIRKWOOD — Msengeni 6120</div>
<input id="q" placeholder="Ask anything... e.g. photosynthesis, NSFAS, Newton">
<select id="subject"><option value="All">All Subjects</option></select>
<select id="grade"><option value="All">All Grades</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select>
<button onclick="askOnline()" style="background:#7c3aed;margin-top:8px">✨ ASK MUSE SPARK ONLINE</button><button onclick="ask()">🔍 SEARCH OFFLINE</button>
<div class="grid">
<button onclick="quick('NSFAS','Life Orientation','Grade 12')">💰 NSFAS</button>
<button onclick="quick('APS','Life Orientation','Grade 12')">🎓 APS + Uni</button>
<button onclick="quick('photosynthesis','Life Sciences','Grade 12')">🌱 Photosynthesis</button>
<button onclick="quick('Newton','Physical Sciences','Grade 10')">⚛️ Newton</button>
</div>
<div id="out"><p>237+ Q&A • CAPS Gr 9-12 • NSC 2020-2025 Past Papers + Memos • All 11 Languages • Bursaries + Careers • Flight Mode Works</p></div>
<script>
let DATA=[];
Promise.resolve(window.NINO_DATA).then(d=>{DATA=d;
let subs=[...new Set(d.map(x=>x.subject))].sort();
let s=document.getElementById('subject');
subs.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x+' ('+d.filter(y=>y.subject==x).length+')';s.appendChild(o)});
document.getElementById('out').innerHTML='<p><b>'+d.length+' questions loaded offline.</b> Tap a button or search.</p>';
});
function score(r,qw,sub,gr){
let s=0, txt=(r.subject+' '+r.topic+' '+r.question+' '+r.answer).toLowerCase();
qw.forEach(w=>{if(txt.includes(w)) s+=2});
if(sub!='All'&&r.subject==sub) s+=10;
if(gr!='All'&&r.grade==gr) s+=8;
return s;
}
function ask(){
let q=document.getElementById('q').value||'photosynthesis';
let sub=document.getElementById('subject').value, gr=document.getElementById('grade').value;
let qw=q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2);
let res=DATA.map(r=>({r, s:score(r,qw,sub,gr)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
if(res.length==0){document.getElementById('out').innerHTML='<p><b>No offline match for:</b> '+q+'<br>Tap ✨ ASK MUSE SPARK ONLINE for a full answer.</p>';return;}
  let html='<p><b>Results for:</b> '+q+' • '+sub+' • '+gr+'</p>';
res.forEach(x=>{html+='<div class="card"><div class="meta">'+x.r.subject+' • '+x.r.grade+' • '+x.r.topic+' • '+(x.r.year||'')+' '+(x.r.paper||'')+'</div><b>'+x.r.question+'</b><div class="ans">'+x.r.answer+'</div><div class="meta">Score '+x.s+'</div></div>'});
document.getElementById('out').innerHTML=html;
}
function quick(q,sub,gr){document.getElementById('q').value=q;document.getElementById('subject').value=sub;document.getElementById('grade').value=gr;ask();}

function askOnline(){
  let q=document.getElementById('q').value||'photosynthesis';
  document.getElementById('out').innerHTML='<p><b>Asking Muse Spark 1.3 online...</b> (uses your credits)</p>';
  try {
    if (typeof NINO === 'undefined' || !NINO.hasKey()) {
      document.getElementById('out').innerHTML='<p><b>No key found.</b> Put mtm_key_txt in Download folder.</p>';
      return;
    }
    let raw = NINO.askSpark(q);
    document.getElementById('out').innerHTML='<div class="card"><b>Muse Spark 1.3 • Online</b><div class="ans">'+raw+'</div></div>';
  } catch(e) {
    document.getElementById('out').innerHTML='<p><b>Error:</b> '+e+'</p>';
  }
}
</script></body></html>
